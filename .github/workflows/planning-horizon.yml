name: Planning horizon
on:
  milestone:
    types: [closed, opened, created, edited, deleted]
  issues:
    types: [closed, reopened, milestoned, demilestoned, deleted]
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# One queue writer. New events can coalesce: every run reads the entire live horizon.
concurrency:
  group: planning-horizon
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'lbliii/mcportal'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Check horizon and ensure one planning request
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/planning-horizon.ts --queue
