name: Bug report
description: Describe something that does not work and how to reproduce it.
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: "Include only public, redacted examples. Report credentials or security vulnerabilities through the security policy, not a public issue."
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: What were you trying to do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the smallest example, source URL if public, and whether the problem repeats.
      placeholder: "1. Open…\n2. Choose…\n3. Observe…"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Version and environment
      description: MCPortal version or commit; agent host and version; OS/browser; hosted, local, or linked mode. Unknown is fine.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and impact
      description: Optional screenshots, redacted error/reference, affected users, and workaround. Do not include tokens, private content, or callback URLs.
