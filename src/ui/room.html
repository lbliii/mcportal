<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MCPortal</title>
<!--MCPORTAL_BOOT-->
<style>
  /*include:design/tokens.css*/
  /*include:room/room.css*/
  /*include:room/experiences.css*/
  /*include:room/navigation.css*/
  /*include:room/tooltips.css*/
  /*include:space.css*/
  /*include:design/primitives.css*/
</style>
</head>
<body>
<template id="brandBadge"><!--include:brand/badge.svg--></template>
<header class="bar" id="mainBar">
  <div class="brand" aria-label="MCPortal"><!--include:brand/mark-line.svg--><!--include:brand/wordmark.svg--></div>
  <div id="roomName" hidden></div>
  <nav class="experience-nav" aria-label="Main navigation">
    <button type="button" id="btnExperienceRoom" aria-current="page"><span class="experience-nav-label">Room</span></button>
    <button type="button" id="btnRecall"><span class="experience-nav-label">Library</span></button>
    <button type="button" class="ib" id="btnMore" data-icon="more" data-tooltip aria-label="More" popovertarget="moreMenu" aria-expanded="false"></button>
  </nav>
  <div class="spacer"></div>
  <div class="global-actions" role="group" aria-label="Display and settings">
    <button class="ib" id="btnExpand" data-icon="expand" data-tooltip aria-label="Fullscreen"></button>
    <button class="ib room-only" id="btnSettings" data-icon="settings" data-tooltip aria-label="Settings" aria-haspopup="dialog" aria-controls="settingsPanel" aria-expanded="false"></button>
  </div>
</header>
<div class="navigation-menu" id="moreMenu" popover aria-label="More activities">
  <button type="button" id="btnChanges"><span data-icon="changes" aria-hidden="true"></span><span>Page updates<small>Track pages and new releases</small></span></button>
  <button type="button" id="btnUpcoming"><span data-icon="upcoming" aria-hidden="true"></span><span>Events<small>Follow artists and calendars</small></span></button>
</div>
<div class="room-toolbar room-only" role="group" aria-label="Room actions">
  <span class="status" id="status" role="status">Opening your portal…</span>
  <div class="spacer"></div>
  <button class="link-btn" id="btnCatchup" type="button">Catch up</button>
  <button class="ib" id="btnAdd" data-icon="plus" data-tooltip aria-label="Add source" aria-expanded="false" aria-controls="addSheet"></button>
  <button class="ib" id="btnRoomOptions" data-icon="more" data-tooltip popovertarget="roomOptions" aria-expanded="false" aria-label="Room options"></button>
</div>
<div class="navigation-menu" id="roomOptions" popover aria-label="Room options">
  <button type="button" id="btnRefresh"><span data-icon="refresh" aria-hidden="true"></span>Refresh sources</button>
</div>
<dialog class="settings-panel" id="settingsPanel" aria-labelledby="settingsTitle">
  <header class="settings-head"><h2 id="settingsTitle">Settings</h2><button type="button" class="ib" id="btnCloseSettings" data-icon="close" data-tooltip aria-label="Close settings" autofocus></button></header>
  <section class="settings-section">
    <h3>Room layout</h3>
    <div class="settings-layouts" id="layoutMenu" role="group" aria-label="Room layout">
      <button type="button" data-layout="columns" aria-pressed="true"><span class="layout-preview" aria-hidden="true"><i></i><i></i><i></i></span><b>Columns</b><span>Sources side by side</span></button>
      <button type="button" data-layout="catalogue" aria-pressed="false"><span class="layout-preview" aria-hidden="true"><i></i><i></i><i></i></span><b>List</b><span>Compact rows</span></button>
      <button type="button" data-layout="editorial" aria-pressed="false"><span class="layout-preview" aria-hidden="true"><i></i><i></i><i></i></span><b>Magazine</b><span>One leading story</span></button>
      <button type="button" data-layout="paperback" aria-pressed="false"><span class="layout-preview" aria-hidden="true"><i></i><i></i><i></i></span><b>Covers</b><span>A shelf of sources</span></button>
      <button type="button" data-layout="shelves" aria-pressed="false"><span class="layout-preview" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span><b>Shelves</b><span>Stories in rows</span></button>
      <button type="button" data-layout="river" aria-pressed="false"><span class="layout-preview" aria-hidden="true"><i></i><i></i><i></i></span><b>Timeline</b><span>Newest stories first</span></button>
      <button type="button" data-layout="frontpage" aria-pressed="false" hidden><b>Front page</b><span>Your agent’s picks, then top stories</span></button>
    </div>
  </section>
  <section class="settings-section">
    <h3>Reading</h3>
    <label class="settings-field" id="openInField" hidden>Open stories<select id="openIn"><option value="card">In this room</option><option value="chat">In the conversation</option></select></label>
    <label class="settings-field">Show source details<input type="checkbox" id="showSources"></label>
    <p class="settings-hint">Show where each source’s data comes from.</p>
  </section>
  <section class="settings-section"><h3>Account</h3><div class="account-settings" id="whoMenu"></div></section>
</dialog>
<section id="addSheet" class="add-sheet room-only" hidden>
  <div class="add-row" role="group" aria-label="Source type"><button id="addFeed" class="btn" type="button" aria-pressed="true">Feed or site</button><button id="addStore" class="btn" type="button" aria-pressed="false">Shopify store</button></div>
  <div id="storeScope" class="add-row" hidden><label>Collection handle (optional) <input id="storeCollection" type="text" maxlength="80" placeholder="new-arrivals"></label><label><input id="storeSales" type="checkbox"> Sales only</label></div>
  <form class="add-row" id="addForm">
    <input id="addInput" type="text" autocomplete="off" spellcheck="false" placeholder="theverge.com, r/LocalLLaMA, youtube.com/@channel, owner/repo…" aria-label="Site, feed, subreddit, channel or repo">
    <button class="btn" type="submit">Find sources</button>
  </form>
  <div class="add-hint"><button class="link-btn" type="button" id="btnImportOpml">Import subscriptions from another reader (OPML)</button></div>
  <div class="add-hint" id="addHint" role="status" aria-live="polite" aria-atomic="true">Paste a site or feed and MCPortal finds what it can show. Sites with feeds, Reddit, YouTube, Bluesky, Mastodon, GitHub, Substack and more.</div>
  <ul class="cands" id="addResults"></ul>
</section>
<main id="grid" class="grid" aria-label="Your portal room" aria-live="polite">
  <div class="col" style="flex-grow:1"><div class="portal"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div></div>
</main>
<section id="experiences" class="experiences" hidden></section>
<section id="welcome" class="welcome" hidden></section>
<section id="importReport" class="import-report" aria-label="Subscription import results" hidden></section>
<input type="file" id="opmlFile" accept=".opml,.xml,text/xml,application/xml,text/x-opml" hidden>
<section class="reader-shell" aria-label="Reader">
  <div id="readerControls"></div>
  <article id="reader" class="reader" hidden></article>
</section>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  'use strict';
  const APP_INFO = { name: 'mcportal-room', version: '0.1.0' };
  const DEV = window.__MCPORTAL_DEV__ || null;   // set by /preview: talk to /mcp directly
  const root = document.documentElement;
  /*include:design/palettes.js*/
  /*include:design/theme.js*/
  const theme = MCPortalTheme.create(root);
  const scrollBehavior = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth';
  if (DEV) root.classList.add('framed');
  /** @type {ById<RoomElements>} */
  const $ = (id) => /** @type {any} */ (document.getElementById(id));
  /** Elements matching a selector (the room only queries HTML elements). @param {string} selector */
  const $$ = (selector, /** @type {ParentNode} */ from = document) => /** @type {NodeListOf<HTMLElement>} */ (from.querySelectorAll(selector));
  /** The first element matching a selector, or null. @param {string} selector */
  const $first = (selector, /** @type {ParentNode} */ from = document) => /** @type {HTMLElement | null} */ (from.querySelector(selector));
  /*include:space-inks.js*/
  /*include:art.js*/
  /*include:space-format.js*/

  // MCPortal icon set: 24px grid, 1.75px round strokes, 3px house corners, drawn in currentColor.
  // The icon set and its stroke come from scripts/brand.ts, so they match the Line mark.
  /*include:brand/icons.js*/
  /** An icon from the generated set, drawn in currentColor. @param {string} name */
  function icon(name) {
    const NS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', '0 0 24 24'); svg.setAttribute('aria-hidden', 'true');
    svg.setAttribute('stroke-width', String(ICON_STROKE));
    const { d, dot, state } = /** @type {Record<string, { d: string, dot?: number[], state?: true }>} */ (ICONS)[name] ?? { d: '' };
    const path = document.createElementNS(NS, 'path'); path.setAttribute('d', d);
    svg.append(path);
    if (dot) {
      const circle = document.createElementNS(NS, 'circle');
      circle.setAttribute('cx', String(dot[0])); circle.setAttribute('cy', String(dot[1])); circle.setAttribute('r', String(dot[2]));
      circle.setAttribute('fill', 'currentColor'); circle.setAttribute('stroke', 'none');
      if (state) circle.setAttribute('class', 'icon-state');   // shown only while its button is pressed
      svg.append(circle);
    }
    return svg;
  }
  /** @param {string} name @param {string} label @param {(e: MouseEvent) => void} onclick */
  function iconButton(name, label, onclick, cls = 'ib sm') {
    return el('button', { class: cls, 'data-tooltip': '', 'aria-label': label, onclick }, icon(name));
  }
  for (const node of $$('[data-icon]')) node.replaceChildren(icon(node.dataset.icon ?? ''));

  /*include:room/bridge.js*/
  /*include:room/dom.js*/
  /*include:room/tooltips.js*/
  /*include:room/experiences.js*/
  /*include:room/recall.js*/
  /*include:room/collections.js*/
  /*include:room/compare.js*/
  /*include:room/catchup.js*/
  /*include:room/watches.js*/
  /*include:room/room.js*/
  /*include:room/items.js*/
  /*include:room/layouts.js*/
  /*include:room/views.js*/
  /*include:room/river.js*/
  /*include:room/levels.js*/
  /*include:room/seen.js*/
  /*include:room/reader.js*/
  /*include:room/reader-tools.js*/
  /*include:room/reading.js*/
  /*include:room/passage.js*/
  /*include:room/handoff.js*/
  /*include:room/highlights.js*/
  /*include:room/docs.js*/
  /*include:room/social.js*/
  /*include:room/reblog.js*/
  /*include:room/add.js*/
  /*include:room/shop.js*/
  /*include:room/toolbar.js*/
  /*include:room/boot.js*/
})();
</script>
</body>
</html>
