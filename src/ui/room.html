<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MCPortal</title>
<!--MCPORTAL_BOOT-->
<style>
  /*include:design/tokens.css*/
  /*include:room/room.css*/
  /*include:design/primitives.css*/
</style>
</head>
<body>
<template id="brandBadge"><!--include:brand/badge.svg--></template>
<header class="bar">
  <div class="brand" title="MCPortal"><!--include:brand/mark-line.svg--><!--include:brand/wordmark.svg--></div>
  <div class="room-name" id="roomName"></div>
  <div class="spacer"></div>
  <span class="status" id="status">Warming up the portal…</span>
  <span class="sep room-only"></span>
  <div class="seg room-only" role="group" aria-label="Layout">
    <button class="ib" data-layout="columns" data-icon="columns" aria-pressed="true" title="Columns: scroll sideways, then down each column" aria-label="Columns layout"></button>
    <button class="ib" data-layout="shelves" data-icon="shelves" aria-pressed="false" title="Shelves: one sideways row per source" aria-label="Shelves layout"></button>
  </div>
  <button class="ib room-only" id="btnSpace" data-icon="space" title="Your space: what people who follow you see" aria-label="Open your space"></button>
  <button class="ib room-only" id="btnAdd" data-icon="plus" aria-pressed="false" title="Add a source: any site, feed, subreddit, YouTube channel or repo" aria-label="Add a source"></button>
  <button class="ib room-only" id="btnOpenIn" data-icon="chat" aria-pressed="false" title="Open stories as their own card in the conversation" aria-label="Open stories in chat" hidden></button>
  <button class="ib room-only" id="btnSources" data-icon="sources" aria-pressed="false" title="Show where each portal's data came from" aria-label="Show sources"></button>
  <button class="ib room-only" id="btnRefresh" data-icon="refresh" title="Refresh all portals" aria-label="Refresh all portals"></button>
  <button class="ib" id="btnExpand" data-icon="expand" title="Fullscreen: step all the way through" aria-label="Fullscreen"></button>
</header>
<section id="addSheet" class="add-sheet room-only" hidden>
  <form class="add-row" id="addForm">
    <input id="addInput" type="text" autocomplete="off" spellcheck="false" placeholder="theverge.com, r/LocalLLaMA, youtube.com/@channel, owner/repo…" aria-label="Site, feed, subreddit, channel or repo">
    <button class="btn" type="submit">Scan</button>
  </form>
  <div class="add-hint"><button class="link-btn" type="button" id="btnImportOpml">Import subscriptions from another reader (OPML)</button></div>
  <div class="add-hint" id="addHint">Paste a site or feed and MCPortal finds what it can show. Sites with feeds, Reddit, YouTube, Bluesky, Mastodon, GitHub, Substack and more.</div>
  <ul class="cands" id="addResults"></ul>
</section>
<main id="grid" class="grid" aria-live="polite">
  <div class="col" style="flex-grow:1"><div class="portal"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div></div>
</main>
<section id="welcome" class="welcome" hidden></section>
<input type="file" id="opmlFile" accept=".opml,.xml,text/xml,application/xml,text/x-opml" hidden>
<article id="reader" class="reader" hidden></article>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  'use strict';
  const APP_INFO = { name: 'mcportal-room', version: '0.1.0' };
  const DEV = window.__MCPORTAL_DEV__ || null;   // set by /preview: talk to /mcp directly
  const root = document.documentElement;
  /*include:design/palettes.js*/
  /*include:design/theme.js*/
  const theme = MCPortalTheme.create(root);
  const scrollBehavior = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth';
  if (DEV) root.classList.add('framed');
  /** @type {ById<RoomElements>} */
  const $ = (id) => /** @type {any} */ (document.getElementById(id));
  /** Elements matching a selector (the room only queries HTML elements). @param {string} selector */
  const $$ = (selector, /** @type {ParentNode} */ from = document) => /** @type {NodeListOf<HTMLElement>} */ (from.querySelectorAll(selector));
  /** The first element matching a selector, or null. @param {string} selector */
  const $first = (selector, /** @type {ParentNode} */ from = document) => /** @type {HTMLElement | null} */ (from.querySelector(selector));
  /*include:art.js*/

  // MCPortal icon set: 24px grid, 1.75px round strokes, 1.5px corner radius, drawn in currentColor.
  // The icon set and its stroke come from scripts/brand.ts, so they match the Line mark.
  /*include:brand/icons.js*/
  function icon(name) {
    const NS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', '0 0 24 24'); svg.setAttribute('aria-hidden', 'true');
    svg.setAttribute('stroke-width', String(ICON_STROKE));
    const { d, dot } = ICONS[name];
    const path = document.createElementNS(NS, 'path'); path.setAttribute('d', d);
    svg.append(path);
    if (dot) {
      const circle = document.createElementNS(NS, 'circle');
      circle.setAttribute('cx', String(dot[0])); circle.setAttribute('cy', String(dot[1])); circle.setAttribute('r', String(dot[2]));
      circle.setAttribute('fill', 'currentColor'); circle.setAttribute('stroke', 'none');
      svg.append(circle);
    }
    return svg;
  }
  function iconButton(name, label, onclick, cls = 'ib sm') {
    return el('button', { class: cls, title: label, 'aria-label': label, onclick }, icon(name));
  }
  for (const node of $$('[data-icon]')) node.replaceChildren(icon(node.dataset.icon));

  /*include:room/bridge.js*/
  /*include:room/dom.js*/
  /*include:room/room.js*/
  /*include:room/reader.js*/
  /*include:room/docs.js*/
  /*include:room/social.js*/
  /*include:room/add.js*/
  /*include:room/toolbar.js*/
  /*include:room/boot.js*/
})();
</script>
</body>
</html>
