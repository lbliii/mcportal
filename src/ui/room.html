<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MCPortal</title>
<!--MCPORTAL_BOOT-->
<style>
  /*include:design/tokens.css*/
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  /* Paint our own canvas even inline: a transparent iframe can expose a host backing
     with a different theme, hiding text until an opaque hover background appears. */
  :root { --mp-surface-page: var(--mp-surface-canvas); --mp-surface-card: var(--mp-surface-canvas); }
  :root.framed { --mp-surface-page: var(--mp-surface-inset); --mp-surface-card: var(--mp-surface-canvas); }
  html, body { margin: 0; background: var(--mp-surface-page); color: var(--mp-text-primary); }
  html { font-size: 100%; }
  body { font: var(--mp-type-13-5)/var(--mp-line-ui) var(--mp-font-ui, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif); }
  button { font: inherit; color: inherit; }

  .bar { position: sticky; top: 0; z-index: var(--mp-layer-sticky); display: flex; flex-wrap: wrap; align-items: center; gap: var(--mp-space-4); padding: 5px var(--mp-space-8) 5px var(--mp-space-12); background: var(--mp-surface-page); border-bottom: 1px solid var(--mp-border-divider); }
  /* brand: the Line mark and the MCPORTAL wordmark (src/ui/brand, generated by scripts/brand.ts) */
  :root { --mp-source-lead-mix: 100%; }
  :root[data-theme="dark"] { --mp-source-lead-mix: 72%; }
  .brand { display: inline-flex; align-items: center; gap: var(--mp-space-6); color: var(--mp-text-primary); }
  .brand-line { width: 17px; height: 17px; flex: none; }
  .brand-dot { fill: var(--mp-brand-brick); }
  .brand-word { height: 10px; width: auto; display: block; }
  .brand-mc { fill: currentColor; }
  .brand-portal { fill: var(--mp-brand-teal); }
  .room-name { color: var(--mp-text-secondary); font-size: var(--mp-type-12); }
  .spacer { flex: 1; }
  .status { color: var(--mp-text-secondary); font-size: var(--mp-type-12); }
  .btn { border: 1px solid var(--mp-border-divider); background: var(--mp-surface-canvas); border-radius: var(--mp-radius-control); padding: var(--mp-space-4) var(--mp-space-10); font-size: var(--mp-type-12); cursor: pointer; }
  .btn:hover { background: var(--mp-surface-hover); }
  .btn[aria-pressed="true"] { border-color: var(--mp-border-selected); color: var(--mp-action-primary); }
  /* icon controls: every control is a 26px square icon with a tooltip, so text keeps the room */
  .ib { display: inline-flex; align-items: center; justify-content: center; flex: none; width: var(--mp-control-height); height: var(--mp-control-height); padding: 0; border: 0; border-radius: var(--mp-radius-sm); background: none; color: var(--mp-text-secondary); cursor: pointer; }
  .ib:hover, .ib:focus-visible { background: var(--mp-surface-hover); color: var(--mp-text-primary); outline: none; }
  .ib[aria-pressed="true"] { color: var(--mp-action-primary); background: var(--mp-surface-hover); }
  .ib svg, .mi svg { width: var(--mp-icon-normal); height: var(--mp-icon-normal); fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
  .ib.sm { width: var(--mp-control-minimum); height: var(--mp-control-minimum); }
  .ib.sm svg { width: var(--mp-icon-small); height: var(--mp-icon-small); }
  .seg { display: inline-flex; gap: 1px; padding: 1px; border: 1px solid var(--mp-border-control); border-radius: var(--mp-radius-control); }
  .seg .ib { width: var(--mp-control-minimum); height: var(--mp-control-minimum); border-radius: 5px; }
  .sep { width: 1px; height: 16px; background: var(--mp-border-divider); margin: 0 3px; }
  :root.article-view .room-only, :root.welcome-view .room-only { display: none !important; }

  /* columns: a lane of fixed-width columns that scrolls sideways; each column scrolls its own items */
  :root { --mp-lane-height: 560px; }
  :root.fullscreen { --mp-lane-height: calc(100vh - 38px); }
  .grid { display: flex; gap: var(--mp-space-10); padding: var(--mp-space-10); height: var(--mp-lane-height); overflow-x: auto; overflow-y: hidden; scroll-snap-type: x proximity; scroll-padding: 0 var(--mp-space-10); overscroll-behavior-x: contain; }
  .col { flex: var(--mp-column-weight, 1) 0 calc(var(--mp-column-weight, 1) * var(--mp-portal-column-width)); min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: var(--mp-space-10); scroll-snap-align: start; }
  .col .portal { flex: 1 1 0; min-height: 0; }
  .portal { background: var(--mp-surface-card); border: 1px solid var(--mp-border-divider); border-radius: var(--mp-radius-card); display: flex; flex-direction: column; overflow: hidden; }
  .portal-head { display: flex; align-items: center; gap: 7px; padding: 5px var(--mp-space-6) 5px 11px; border-bottom: 1px solid var(--mp-border-divider); }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .portal-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .portal-count { color: var(--mp-text-secondary); font-size: var(--mp-type-12); }
  .portal-head .tools { margin-left: auto; display: flex; gap: 1px; }
  .items { list-style: none; margin: 0; padding: 3px; flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
  .item { display: block; width: 100%; text-align: left; border: 0; background: none; padding: var(--mp-space-6) var(--mp-space-8); border-radius: var(--mp-radius-sm); cursor: pointer; }
  .item:hover, .item:focus-visible { background: var(--mp-surface-hover); outline: none; }
  .item-title { font-weight: 500; line-height: 1.35; }
  .item-meta { color: var(--mp-text-secondary); font-size: var(--mp-type-11-5); margin-top: var(--mp-space-2); display: flex; flex-wrap: wrap; align-items: center; gap: var(--mp-space-2) 9px; }
  .item-summary { color: var(--mp-text-secondary); font-size: var(--mp-type-12-5); margin-top: var(--mp-space-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  /* inline meta icons: comment count links to the discussion, the arrow opens the original */
  .mi { display: inline-flex; align-items: center; gap: 3px; border: 0; padding: 1px 3px; margin: -1px -3px; border-radius: var(--mp-radius-xs); background: none; color: inherit; font: inherit; cursor: pointer; }
  .mi svg { width: 12px; height: 12px; }
  .mi:hover, .mi:focus-visible { color: var(--mp-action-primary); background: var(--mp-surface-inset); outline: none; }
  .mi.go { margin-left: auto; }
  .mi.go + .mi.save, .mi.save:first-child { margin-left: 0; }
  .mi.save[aria-pressed="true"], .ib.save[aria-pressed="true"] { color: var(--mp-source-saved); }
  .mi.save[aria-pressed="true"] svg, .ib.save[aria-pressed="true"] svg { fill: currentColor; }
  .portal-foot { display: none; padding: 7px var(--mp-space-12); border-top: 1px solid var(--mp-border-divider); color: var(--mp-text-secondary); font-size: var(--mp-type-11-5); word-break: break-all; }
  :root.show-sources .portal-foot { display: block; }
  /* shelves: one horizontally scrolling row of cards per portal */
  .grid.shelves { display: block; height: auto; padding: var(--mp-space-10) 0 var(--mp-space-2); overflow: visible; }
  .shelf { margin-bottom: var(--mp-space-12); }
  .shelf-head { display: flex; align-items: center; gap: 7px; padding: 0 var(--mp-space-8) var(--mp-space-4) var(--mp-space-12); }
  .shelf-head .tools { margin-left: auto; display: flex; gap: 1px; }
  .shelf-row { display: flex; gap: var(--mp-space-10); overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding: 0 var(--mp-space-12); padding: var(--mp-space-2) var(--mp-space-12) var(--mp-space-10); scrollbar-width: thin; }
  .card { flex: 0 0 var(--mp-card-width); width: var(--mp-card-width); min-width: 0; overflow: hidden; height: var(--mp-card-height); scroll-snap-align: start; background: var(--mp-surface-card); border: 1px solid var(--mp-border-divider); border-top: 3px solid var(--mp-source-color); border-radius: var(--mp-radius-card); padding: 9px 11px; display: flex; flex-direction: column; gap: var(--mp-space-4); cursor: pointer; }
  .card:hover, .card:focus-visible { background: var(--mp-surface-hover); outline: none; }
  .card .item-title { font-weight: 600; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .card .item-summary { margin-top: 0; }
  .card .item-meta { margin-top: auto; flex-wrap: nowrap; overflow: hidden; white-space: nowrap; }
  :root.fullscreen .card { flex-basis: 264px; width: 264px; height: 176px; }
  .shelf .portal-foot { border: 0; padding: 0 var(--mp-space-12) var(--mp-space-4); }
  /* add a source */
  .add-sheet { margin: 8px 10px 0; padding: var(--mp-space-8); border: 1px solid var(--mp-border-divider); border-radius: var(--mp-radius-card); background: var(--mp-surface-card); }
  .add-row { display: flex; gap: var(--mp-space-6); }
  .add-row input { flex: 1; min-width: 0; padding: 5px 9px; border: 1px solid var(--mp-border-control); border-radius: var(--mp-radius-control); background: var(--mp-surface-canvas); color: var(--mp-text-primary); font: inherit; }
  .add-row input:focus { outline: 2px solid var(--mp-action-primary); outline-offset: -1px; }
  .add-hint { color: var(--mp-text-secondary); font-size: var(--mp-type-12); margin: 6px 2px 0; }
  .cands { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: var(--mp-space-6); }
  .cand { display: flex; gap: 9px; align-items: flex-start; padding: 7px var(--mp-space-8) 7px var(--mp-space-10); border: 1px solid var(--mp-border-control); border-radius: var(--mp-radius-control); }
  .cand .dot { margin-top: var(--mp-space-6); }
  .cand-main { flex: 1; min-width: 0; }
  .cand-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cand-sub, .cand-prev { color: var(--mp-text-secondary); font-size: var(--mp-type-11-5); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cand-prev { font-size: var(--mp-type-12); margin-top: var(--mp-space-2); }
  /* pictures: fetched by the server as data: URIs, loaded as they scroll into view */
  .thumb { display: block; position: relative; flex: none; overflow: hidden; border-radius: var(--mp-radius-sm); }
  .thumb img { position: relative; display: block; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity var(--mp-duration-feedback) var(--mp-ease-standard); }
  /* fallback art (art.js): shown until the picture loads, and instead of it when there's none.
     Ink colours are per source; dark mode swaps the paper for the darkest ink. */
  .thumb .art { position: absolute; inset: 0; width: 100%; height: 100%; --mp-art-paper: var(--mp-art-ink-p); --mp-art-ink: var(--mp-art-ink-c); }
  :root[data-theme="dark"] .art { --mp-art-paper: var(--mp-art-ink-c); --mp-art-ink: var(--mp-art-ink-p); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme]) .art { --mp-art-paper: var(--mp-art-ink-c); --mp-art-ink: var(--mp-art-ink-p); } }
  .art .ap { fill: var(--mp-art-paper); } .art .aa { fill: var(--mp-art-ink-a); } .art .ab { fill: var(--mp-art-ink-b); } .art .ac { fill: var(--mp-art-ink); } .art .ax { fill: var(--mp-art-ink-x); }
  .art .sb { stroke: var(--mp-art-ink-b); } .art .sc { stroke: var(--mp-art-ink); }
  .thumb img.on { opacity: 1; }
  .thumb .play { position: absolute; right: 6px; bottom: 6px; width: 24px; height: 24px; border-radius: 50%; background: rgba(0,0,0,.62); color: #fff; display: flex; align-items: center; justify-content: center; }
  .thumb .play svg { width: 12px; height: 12px; fill: currentColor; stroke: none; margin-left: 2px; }
  .item-row { display: flex; gap: 9px; align-items: flex-start; }
  .item-row .thumb { width: 88px; height: 50px; margin-top: var(--mp-space-2); }
  .item-text { flex: 1; min-width: 0; }
  .avatar { display: inline-block; width: 16px; height: 16px; border-radius: var(--mp-radius-xs); vertical-align: -3px; margin-right: 6px; background: var(--mp-surface-hover); object-fit: cover; }
  .avatar.gone { display: none; }
  .card.media { height: var(--mp-card-media-height); padding: 0; gap: 0; }
  .card.media .thumb { height: 118px; border-radius: 0; }
  .card-body { display: flex; flex-direction: column; gap: var(--mp-space-4); flex: 1; min-height: 0; padding: var(--mp-space-8) 11px 9px; }
  .card.media .item-title { -webkit-line-clamp: 2; }
  .card.media .item-summary { display: none; }
  :root.fullscreen .card.media { height: 246px; }
  :root.fullscreen .card.media .thumb { height: 148px; }
  /* welcome: first-run starter packs */
  .welcome { max-width: 760px; margin: 0 auto; padding: 22px var(--mp-space-16) var(--mp-space-24); }
  .welcome .brand-badge { display: block; width: 40px; height: 40px; }
  .welcome h1 { font-size: var(--mp-type-22); line-height: 1.2; margin: 8px 0 4px; letter-spacing: -0.015em; }
  .welcome .lede { color: var(--mp-text-secondary); margin: 0 0 14px; max-width: 560px; }
  .packs { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: var(--mp-space-8); }
  .pack { position: relative; display: flex; flex-direction: column; gap: var(--mp-space-2); text-align: left; padding: var(--mp-space-10) 11px; border: 1px solid var(--mp-border-divider); border-radius: var(--mp-radius-card); background: var(--mp-surface-card); cursor: pointer; }
  .pack:hover, .pack:focus-visible { background: var(--mp-surface-hover); outline: none; }
  .pack[aria-pressed="true"] { border-color: var(--mp-action-primary); box-shadow: inset 0 0 0 1px var(--mp-action-primary); }
  .pack:disabled { opacity: .45; cursor: default; }
  .pack .pl { font-weight: 650; }
  .pack .pb { color: var(--mp-text-secondary); font-size: var(--mp-type-12); line-height: 1.35; }
  .pack .ps { color: var(--mp-text-secondary); font-size: var(--mp-type-11); margin-top: 5px; line-height: 1.35; }
  .pack .tick { position: absolute; top: 8px; right: 8px; width: 18px; height: 18px; border-radius: 50%; background: var(--mp-action-primary); color: var(--mp-action-on-primary); display: none; align-items: center; justify-content: center; }
  .pack .tick svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .pack[aria-pressed="true"] .tick { display: flex; }
  .welcome-actions { display: flex; flex-wrap: wrap; align-items: center; gap: var(--mp-space-12); margin-top: 14px; }
  .btn.primary { background: var(--mp-action-primary); border-color: var(--mp-action-primary); color: var(--mp-action-on-primary); padding: var(--mp-space-6) 14px; font-weight: 600; }
  .btn.primary:hover { background: var(--mp-action-primary); filter: brightness(1.08); }
  .btn.primary:disabled { opacity: .45; cursor: default; filter: none; }
  .link-btn { border: 0; padding: 0; background: none; color: var(--mp-text-secondary); font: inherit; font-size: var(--mp-type-12-5); text-decoration: underline; cursor: pointer; }
  .ask { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--mp-border-divider); }
  .ask .lede { margin-bottom: var(--mp-space-8); font-size: var(--mp-type-12-5); }
  .building { color: var(--mp-text-secondary); margin-top: 14px; }
  .empty, .error { padding: var(--mp-space-16) var(--mp-space-12); color: var(--mp-text-secondary); }
  .error { color: var(--mp-status-error); }
  .skeleton { height: 12px; margin: 12px; border-radius: var(--mp-radius-xs); background: var(--mp-surface-hover); }

  .reader { max-width: 740px; margin: 0 auto; padding: var(--mp-space-16) var(--mp-space-20) var(--mp-space-40); }
  .reader[hidden] { display: none; }
  :root:not(.fullscreen) .reader { max-height: 640px; overflow-y: auto; }
  .reader-top { display: flex; gap: var(--mp-space-2); align-items: center; margin: -6px 0 10px -6px; }
  .reader h1 { font-size: 24px; line-height: 1.25; margin: 6px 0 6px; letter-spacing: -0.01em; }
  .reader .byline { color: var(--mp-text-secondary); margin-bottom: 18px; }
  .reader .body p, .reader .body li { font-size: var(--mp-type-15); line-height: 1.65; margin: 0 0 14px; }
  .reader .body h2 { font-size: 17px; margin: 22px 0 8px; }
  .reader .body pre { background: var(--mp-surface-canvas); border: 1px solid var(--mp-border-control); border-radius: var(--mp-radius-control); padding: var(--mp-space-10) var(--mp-space-12); overflow-x: auto; font: var(--mp-type-12-5)/1.5 var(--mp-font-mono, ui-monospace, "SF Mono", Menlo, monospace); }
  .reader .body blockquote { margin: 0 0 14px; padding-left: 12px; border-left: 3px solid var(--mp-border-divider); color: var(--mp-text-secondary); white-space: pre-wrap; }
  /* structured blocks (docs pages, and articles with tables, callouts and code) */
  .reader .body h3 { font-size: var(--mp-type-15-5); margin: 18px 0 6px; }
  .reader .body h4 { font-size: var(--mp-type-14); margin: 16px 0 6px; }
  .reader .body h4.sig { font: var(--mp-weight-strong) var(--mp-type-13)/var(--mp-line-ui) var(--mp-font-mono); padding: var(--mp-space-6) var(--mp-space-10); background: var(--mp-surface-hover); border-radius: var(--mp-radius-sm); overflow-wrap: anywhere; }
  .reader .body .li { position: relative; font-size: var(--mp-type-15); line-height: 1.65; margin: 0 0 6px; padding-left: calc(22px + var(--mp-list-depth, 0) * 20px); }
  .reader .body .li::before { content: attr(data-marker); position: absolute; left: calc(var(--mp-list-depth, 0) * 20px); width: 18px; text-align: right; color: var(--mp-text-secondary); font-variant-numeric: tabular-nums; }
  .reader .body .li + :not(.li) { margin-top: 14px; }
  .reader .body code { font: 0.88em/1.4 var(--mp-font-mono, ui-monospace, "SF Mono", Menlo, monospace); background: var(--mp-surface-hover); border-radius: var(--mp-radius-xs); padding: 1px var(--mp-space-4); }
  .reader .body a { color: var(--mp-action-primary); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
  .reader .body .code { position: relative; margin: 0 0 14px; }
  .reader .body .code pre { margin: 0; }
  .reader .body .code-head { display: flex; align-items: center; gap: var(--mp-space-8); padding: 3px var(--mp-space-4) 3px var(--mp-space-12); border: 1px solid var(--mp-border-divider); border-bottom: 0; border-radius: var(--mp-radius-control) 8px 0 0; font-size: var(--mp-type-11-5); color: var(--mp-text-secondary); background: var(--mp-surface-hover); }
  .reader .body .code-head + pre { border-radius: 0 0 8px 8px; }
  .reader .body .code-head .copy { margin-left: auto; border: 0; background: none; padding: var(--mp-space-2) var(--mp-space-8); border-radius: var(--mp-radius-sm); cursor: pointer; color: var(--mp-text-secondary); font-size: var(--mp-type-11-5); }
  .reader .body .code-head .copy:hover { background: var(--mp-surface-canvas); color: var(--mp-text-primary); }
  .reader .body .table-wrap { margin: 0 0 16px; }
  .reader .body .callout { margin: 0 0 16px; padding: var(--mp-space-10) 14px; border-radius: var(--mp-radius-control); border-left: 3px solid var(--mp-callout-tone); background: var(--mp-surface-inset); font-size: var(--mp-type-14-5); line-height: 1.6; white-space: pre-wrap; }
  .reader .body .callout .callout-label { display: block; font-weight: 650; color: var(--mp-callout-tone); margin-bottom: var(--mp-space-2); white-space: normal; }
  .callout.note { --mp-callout-tone: var(--mp-status-info); } .callout.tip { --mp-callout-tone: var(--mp-status-success); } .callout.warning { --mp-callout-tone: var(--mp-status-warning); } .callout.danger { --mp-callout-tone: var(--mp-status-error); }
  .clip-tags { display: flex; flex-wrap: wrap; gap: var(--mp-space-6); margin: -10px 0 16px; }
  .clip-tags span { font-size: var(--mp-type-12); color: var(--mp-text-secondary); background: var(--mp-surface-hover); padding: 1px var(--mp-space-8); border-radius: var(--mp-radius-card); }
  .reader.space { max-width: 1120px; }
  /* docs viewer: contents | page | on this page */
  :root { --mp-text-link: var(--mp-action-primary); }
  .reader.docs { max-width: 1240px; padding-top: 10px; }
  :root:not(.fullscreen) .reader.docs { max-height: 860px; }
  .docs-grid { display: grid; grid-template-columns: 236px minmax(0, 1fr) 184px; gap: 28px; align-items: start; }
  .docs-toc, .docs-otp { position: sticky; top: 0; max-height: 820px; overflow-y: auto; font-size: var(--mp-type-13); padding: var(--mp-space-2) var(--mp-space-2) var(--mp-space-24); }
  :root.fullscreen .docs-toc, :root.fullscreen .docs-otp { top: 46px; max-height: calc(100vh - 60px); }
  .docs-site { font-weight: 650; font-size: var(--mp-type-14); margin: 4px 4px 8px; line-height: 1.3; }
  .docs-up { display: block; font-size: var(--mp-type-12); color: var(--mp-text-secondary); margin: 0 4px 4px; cursor: pointer; background: none; border: 0; padding: 0; text-align: left; }
  .docs-up:hover { color: var(--mp-text-primary); }
  .docs-search { width: 100%; padding: var(--mp-space-6) 9px; border: 1px solid var(--mp-border-control); border-radius: var(--mp-radius-control); background: var(--mp-surface-canvas); color: var(--mp-text-primary); font: inherit; margin: 0 0 10px; }
  .docs-toc details { margin: 0 0 2px; }
  .docs-toc summary { cursor: pointer; font-weight: 600; padding: var(--mp-space-4) var(--mp-space-6); border-radius: var(--mp-radius-sm); list-style: none; display: flex; gap: var(--mp-space-6); align-items: baseline; }
  .docs-toc summary::-webkit-details-marker { display: none; }
  .docs-toc summary::before { content: '›'; color: var(--mp-text-secondary); display: inline-block; width: 8px; transition: transform var(--mp-duration-fast) var(--mp-ease-standard); }
  .docs-toc details[open] > summary::before { transform: rotate(90deg); }
  .docs-toc summary:hover { background: var(--mp-surface-hover); }
  .docs-toc summary .n { margin-left: auto; color: var(--mp-text-secondary); font-weight: 400; font-size: var(--mp-type-11-5); }

  .docs-otp a:hover { color: var(--mp-text-primary); }

  .post .pq { font-size: var(--mp-type-16); line-height: 1.45; white-space: pre-wrap; border-left: 3px solid var(--mp-space-accent); padding-left: 10px; margin: 0 0 6px; display: -webkit-box; -webkit-line-clamp: 8; -webkit-box-orient: vertical; overflow: hidden; }

  .post .mini { font-size: var(--mp-type-12); border-collapse: collapse; width: 100%; }

  .table-wrap th { position: sticky; top: 0; background: var(--mp-surface-canvas); font-weight: 600; }
  .clip-img { display: block; max-width: 100%; max-height: 420px; margin: 0 auto; background: #fff; border-radius: var(--mp-radius-control); cursor: zoom-in; }
  .clip-img.zoom { max-height: none; cursor: zoom-out; }

  .toast { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); background: var(--mp-text-primary); color: var(--mp-surface-canvas); padding: 7px var(--mp-space-12); border-radius: var(--mp-radius-control); font-size: var(--mp-type-12-5); opacity: 0; transition: opacity var(--mp-duration-feedback) var(--mp-ease-standard); pointer-events: none; }
  .toast.show { opacity: .92; }

  .pack, .btn, .docs-pager button, .composer textarea, .docs-search, .add-row input { border-color: var(--mp-border-control); }
