<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MCPortal admin</title>
<link rel="icon" href="/favicon.ico" sizes="48x48"><link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root { --fg: #1b1b1a; --fg2: #6a6a66; --border: #e3e3de; --bg2: #f7f7f4; --accent: #2563eb; --warn: #b45309; --bad: #b91c1c; }
  @media (prefers-color-scheme: dark) { :root { --fg: #ececea; --fg2: #a3a39e; --border: #34342f; --bg2: #1f1f1d; --accent: #6b9bff; --warn: #f59e0b; --bad: #f87171; } body { background: #161615; } }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--fg); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 900px; margin: 0 auto; padding: 22px 18px 40px; }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  h1 { font-size: 19px; margin: 0; letter-spacing: -0.01em; }
  h1 span { color: var(--accent); }
  h2 { font-size: 15px; margin: 26px 0 8px; }
  .muted { color: var(--fg2); font-size: 12.5px; }
  .spacer { flex: 1; }
  button { font: inherit; font-size: 12.5px; padding: 4px 10px; border-radius: 7px; border: 1px solid var(--border); background: transparent; color: var(--fg); cursor: pointer; }
  button:hover { background: var(--bg2); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--bad); }
  input { font: inherit; padding: 5px 9px; border: 1px solid var(--border); border-radius: 7px; background: transparent; color: var(--fg); }
  form.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  th { color: var(--fg2); font-weight: 600; font-size: 12px; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11.5px; border: 1px solid var(--border); }
  .pill.suspended { color: var(--bad); border-color: currentColor; }
  .pill.admin { color: var(--accent); border-color: currentColor; }
  .empty { color: var(--fg2); padding: 8px 0; }
  #msg { min-height: 20px; font-size: 12.5px; margin-top: 6px; }
  #msg.err { color: var(--bad); }
  .wrap { overflow-x: auto; }
  .share { display: none; margin-top: 10px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg2); }
  .share.on { display: block; }
  .share textarea { width: 100%; min-height: 64px; margin: 6px 0; font: inherit; font-size: 13px; padding: 7px 9px; border: 1px solid var(--border); border-radius: 7px; background: transparent; color: var(--fg); resize: vertical; }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; }
</style>
</head>
<body>
<main>
  <header>
    <h1>MC<span>Portal</span> admin</h1>
    <span class="muted" id="me"></span>
    <span class="spacer"></span>
    <form method="post" action="/admin/logout"><button type="submit">Sign out</button></form>
  </header>

  <h2>Invite someone</h2>
  <form class="row" id="inviteForm">
    <input id="inviteLogin" placeholder="GitHub username" autocomplete="off" spellcheck="false" required>
    <button class="primary" type="submit">Invite</button>
    <span class="muted">Their account is created the first time they sign in with GitHub.</span>
  </form>
  <div id="msg" role="status"></div>
  <div class="share" id="share">
    <div class="muted" id="shareTitle"></div>
    <textarea id="shareText" readonly></textarea>
    <div class="actions"><button class="primary" id="copyShare" type="button">Copy message</button><button id="copyShareLink" type="button">Copy link only</button></div>
  </div>

  <h2>Pending invites</h2>
  <div class="wrap"><table><thead><tr><th>GitHub</th><th>Invited by</th><th>When</th><th></th></tr></thead><tbody id="invites"></tbody></table></div>

  <h2>Reports</h2>
  <div class="wrap"><table><thead><tr><th>When</th><th>About</th><th>Reason</th><th>From</th><th>Status</th><th></th></tr></thead><tbody id="reports"></tbody></table></div>

  <h2>Accounts</h2>
  <div class="wrap"><table><thead><tr><th>Account</th><th>GitHub</th><th>Status</th><th>Role</th><th>Joined via</th><th>Since</th><th></th></tr></thead><tbody id="accounts"></tbody></table></div>

  <h2>Audit log</h2>
  <div class="wrap"><table><thead><tr><th>When</th><th>Action</th><th>Target</th><th>By</th><th>Detail</th></tr></thead><tbody id="audit"></tbody></table></div>
</main>
<script nonce="__NONCE__">
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  let csrf = '';
  let me = { login: '', accountId: '' };

  function el(tag, attrs, ...children) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === undefined || v === null || v === false) continue;
      if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
      else node.setAttribute(k, v === true ? '' : v);
    }
    for (const c of children.flat()) if (c !== null && c !== undefined && c !== false) node.append(c instanceof Node ? c : document.createTextNode(String(c)));
    return node;
  }
  const when = (ms) => new Date(ms).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' });
  function say(text, bad) { $('msg').textContent = text; $('msg').className = bad ? 'err' : ''; }

  async function api(path, body) {
    const res = await fetch(path, body === undefined
      ? { credentials: 'same-origin' }
      : { method: 'POST', credentials: 'same-origin', headers: { 'content-type': 'application/json', 'x-csrf': csrf }, body: JSON.stringify(body) });
    const data = await res.json().catch(() => ({}));
    if (res.status === 401) { location.href = '/admin'; throw new Error('Signed out'); }
    if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
    return data;
  }

  // ---- invite links and ready-to-send messages
  const linkFor = (i) => (i.code ? `${location.origin}/join/${i.code}` : '');
  const messageFor = (i) => `Hi @${i.login}! I've invited you to MCPortal, your liminal webspace: a reading portal that lives in your agent. Set it up here (sign in with GitHub as @${i.login}): ${linkFor(i)}`;
  async function copy(text, what) {
    try { await navigator.clipboard.writeText(text); say(`Copied the ${what}.`); }
    catch { showShare(null, text); say(`Couldn't use the clipboard; select the ${what} below and copy it.`, true); }
  }
  function showShare(invite, text) {
    $('share').classList.add('on');
    $('shareTitle').textContent = invite ? `Send this to @${invite.login} (Slack, email, a text…):` : 'Copy this:';
    $('shareText').value = text || messageFor(invite);
    $('copyShare').onclick = () => copy($('shareText').value, 'message');
    $('copyShareLink').hidden = !invite;
    $('copyShareLink').onclick = () => invite && copy(linkFor(invite), 'link');
  }

  function render(data) {
    $('invites').replaceChildren(...(data.invites.length ? data.invites.map((i) => el('tr', null,
      el('td', null, `@${i.login}`), el('td', null, i.invitedBy), el('td', null, when(i.createdAt)),
      el('td', null, el('span', { class: 'actions' },
        i.code ? el('button', { onclick: () => { showShare(i); copy(messageFor(i), 'message'); } }, 'Copy message') : null,
        i.code ? el('button', { onclick: () => copy(linkFor(i), 'link') }, 'Copy link') : null,
        el('button', { class: 'danger', onclick: () => act('uninvite', i.login, `Revoke the invite for @${i.login}? Their link stops working.`) }, 'Revoke'))))) : [el('tr', null, el('td', { colspan: '4', class: 'empty' }, 'No pending invites.'))]));

    $('accounts').replaceChildren(...(data.accounts.length ? data.accounts.map((a) => {
      const self = a.id === me.accountId;
      const action = a.status === 'active'
        ? (self ? el('span', { class: 'muted' }, 'you') : el('button', { class: 'danger', onclick: () => act('suspend', a.id, `Suspend @${a.login}? They lose access within 30 seconds.`, true) }, 'Suspend'))
        : el('button', { onclick: () => act('reinstate', a.id, `Reinstate @${a.login}?`) }, 'Reinstate');
      return el('tr', null,
        el('td', null, el('code', null, a.id)), el('td', null, `@${a.login || '?'}`),
        el('td', null, el('span', { class: `pill ${a.status}` }, a.status)),
        el('td', null, el('span', { class: `pill ${a.role}` }, a.role)),
        el('td', null, a.via), el('td', null, when(a.createdAt)), el('td', null, action));
    }) : [el('tr', null, el('td', { colspan: '7', class: 'empty' }, 'No accounts yet. People get one when they first sign in.'))]));

    const person = (p) => (p ? (p.handle ? `@${p.handle}` : p.login ? `@${p.login} (GitHub)` : p.accountId) : '?');
    const reports = data.reports || [];
    $('reports').replaceChildren(...(reports.length ? reports.map((r) => {
      const t = r.target;
      const about = t.kind === 'share'
        ? (t.exists ? [el('b', null, t.title), t.note ? el('div', { class: 'muted' }, `“${t.note}”`) : null, el('div', { class: 'muted' }, `share by ${person(t.account)}${t.hidden ? ' · hidden' : ''}`)] : el('span', { class: 'muted' }, 'a share that was removed'))
        : [el('span', null, `profile ${person(t.account)}`)];
      const author = t.account && t.account.accountId;
      const actions = r.status === 'open'
        ? [t.kind === 'share' && t.exists && !t.hidden ? el('button', { class: 'danger', onclick: () => moderate('report', { id: r.id, action: 'hide' }, 'Hide this share from everyone but its author?') }, 'Hide share') : null,
           el('button', { onclick: () => moderate('report', { id: r.id, action: 'dismiss' }, 'Dismiss this report?') }, 'Dismiss'),
           author && author !== me.accountId ? el('button', { class: 'danger', onclick: () => act('suspend', author, `Suspend ${person(t.account)}? They lose access within 30 seconds.`, true) }, 'Suspend author') : null]
        : [t.kind === 'share' && t.hidden ? el('button', { onclick: () => moderate('unhide', { id: t.id }, 'Show this share again?') }, 'Unhide') : null];
      return el('tr', null, el('td', null, when(Date.parse(r.createdAt))), el('td', null, about), el('td', null, r.reason), el('td', null, person(r.reporter)),
        el('td', null, el('span', { class: `pill ${r.status === 'open' ? 'suspended' : 'active'}` }, r.status === 'open' ? 'open' : (r.resolution || 'resolved'))),
        el('td', null, el('span', { class: 'actions' }, actions)));
    }) : [el('tr', null, el('td', { colspan: '6', class: 'empty' }, 'No reports.'))]));

    $('audit').replaceChildren(...(data.audit.length ? data.audit.map((e) => el('tr', null,
      el('td', null, when(e.at)), el('td', null, e.action), el('td', null, e.target), el('td', null, e.actor), el('td', { class: 'muted' }, e.detail || ''))) : [el('tr', null, el('td', { colspan: '5', class: 'empty' }, 'Nothing yet.'))]));
  }

  async function act(action, who, question, askReason) {
    if (!confirm(question)) return;
    const reason = askReason ? (prompt('Reason (optional, goes in the audit log):') || '') : undefined;
    try {
      render(await api(`/admin/api/${action}`, { who, reason }));
      say(`Done: ${action} ${who}.`);
    } catch (error) { say(error.message, true); }
  }

  async function moderate(path, body, question) {
    if (!confirm(question)) return;
    try {
      render(await api(`/admin/api/${path}`, body));
      say('Done.');
    } catch (error) { say(error.message, true); }
  }

  $('inviteForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const login = $('inviteLogin').value.trim();
    if (!login) return;
    try {
      const data = await api('/admin/api/invite', { who: login });
      render(data);
      $('inviteLogin').value = '';
      const invite = data.invites.find((i) => i.login === login.replace(/^@/, '').toLowerCase());
      say(`Invited @${login.replace(/^@/, '')}. Send them the message below.`);
      if (invite) showShare(invite);
    } catch (error) { say(error.message, true); }
  });

  (async () => {
    try {
      const data = await api('/admin/api/state');
      csrf = data.csrf; me = data.me;
      $('me').textContent = `signed in as @${me.login}`;
      render(data);
    } catch (error) { say(error.message, true); }
  })();
})();
</script>
</body>
</html>
