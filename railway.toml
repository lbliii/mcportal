[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Also in the Railway dashboard:
#   1. Generate a public domain (Settings → Networking). MCPortal derives its
#      public URL and Host allowlist from RAILWAY_PUBLIC_DOMAIN.
#   2. Attach a volume mounted at /data (profiles + OAuth state live there).
#   3. Auth (the server won't start without one):
#        GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET   (OAuth; callback https://<domain>/oauth/callback)
#        MCPORTAL_ALLOWED_GITHUB_USERS=yourlogin     (optional: keep it private)
#      or MCPORTAL_TOKEN=<long random string>        (single-user bearer token)
#   4. Optionally GITHUB_TOKEN for higher GitHub API rate limits.
